<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tu Campus | Universo del Estudiante</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=DM+Sans:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

/* ======================================================
   UNIVERSO DEL ESTUDIANTE
   CAMPUS RETRO / REVISTA / MADERA
   ====================================================== */

:root {

  --wood: #60371f;
  --wood-dark: #351b10;

  --paper: #eee0c3;
  --paper-light: #f7ecd3;

  --ink: #231814;
  --muted: #6f5c4c;

  --red: #9d2927;
  --red-dark: #79201f;
  --red-soft: #b74b3d;

  --mustard: #c99b47;
  --green: #697761;

  --shadow: rgba(25, 10, 3, .46);
}


html[data-theme="dark"] {

  --paper: #30241e;
  --paper-light: #392b23;

  --ink: #f4e8d2;
  --muted: #c7b69f;

  --red: #b33e39;
  --red-dark: #8d2b28;

  --shadow: rgba(0,0,0,.65);
}


* {
  box-sizing: border-box;
}


html,
body {
  margin: 0;
  min-height: 100%;
}


body {

  min-height: 100vh;

  font-family:
    "DM Sans",
    Arial,
    sans-serif;

  color: var(--ink);

  background-color: var(--wood-dark);

  background-image:

    linear-gradient(
      rgba(45, 20, 8, .08),
      rgba(45, 20, 8, .16)
    ),

    url("madera.jpg");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  overflow-x: hidden;
}


/* fallback madera si no existe madera.jpg */

body::before {

  content: "";

  position: fixed;
  inset: 0;

  z-index: -2;

  background:

    repeating-linear-gradient(
      92deg,
      #4c2917 0px,
      #633a22 70px,
      #75482b 125px,
      #4b2818 210px
    );
}


/* sombra exterior */

body::after {

  content: "";

  position: fixed;
  inset: 0;

  pointer-events: none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 45%,
      rgba(17,7,2,.37) 100%
    );

  z-index: 100;
}


/* ======================================================
   CONTENEDOR
   ====================================================== */

.page {

  position: relative;

  width: min(1450px, 96%);

  min-height: 900px;

  margin: 20px auto;

  padding: 30px;

  overflow: hidden;

}


/* ======================================================
   MARCA
   ====================================================== */

.brand {

  position: absolute;

  top: 12px;
  left: 20px;

  z-index: 10;

  background: #eee2c7;

  color: #8f2925;

  padding: 9px 15px;

  font-family: Anton, sans-serif;

  font-size: 25px;

  line-height: .9;

  letter-spacing: .02em;

  transform: rotate(-2deg);

  box-shadow:
    5px 5px 0 rgba(30,12,5,.25);

  clip-path:
    polygon(
      2% 3%,
      98% 0,
      100% 92%,
      92% 100%,
      3% 96%,
      0 10%
    );
}


.brand span {
  display: block;
}


/* ======================================================
   MINI MENU
   ====================================================== */

.mini-menu {

  position: absolute;

  top: 30px;
  left: 350px;

  display: flex;

  gap: 6px;

  z-index: 9;
}


.mini-menu span {

  padding: 8px 20px;

  font-family:
    "Special Elite",
    monospace;

  font-size: 12px;

  color: #1e1611;

  box-shadow:
    2px 3px 0 rgba(0,0,0,.16);

  transform: rotate(-1deg);
}


.mini-menu span:nth-child(1) {
  background: #b84d3e;
}

.mini-menu span:nth-child(2) {
  background: #d1a351;
}

.mini-menu span:nth-child(3) {
  background: #dfc89e;
}

.mini-menu span:nth-child(4) {
  background: #8c987c;
}


/* ======================================================
   MODO OSCURO
   ====================================================== */

.theme-toggle {

  position: absolute;

  right: 20px;
  top: 25px;

  z-index: 20;

  border: 0;

  padding: 8px 11px;

  background:
    rgba(239,224,195,.88);

  color: #3c271b;

  font-family:
    "Special Elite",
    monospace;

  cursor: pointer;

  transform: rotate(2deg);

  box-shadow:
    3px 3px 0 rgba(0,0,0,.2);
}


/* ======================================================
   TÍTULO
   ====================================================== */

.hero {

  position: absolute;

  left: 65px;
  top: 145px;

  width: 660px;

  z-index: 10;
}


.title-line {

  display: inline-block;

  font-family:
    Anton,
    Impact,
    sans-serif;

  text-transform: uppercase;

  letter-spacing: -.035em;

  line-height: .84;

  color: #111;

  background: #eee2c7;

  padding:
    8px 16px;

  font-size:
    clamp(80px, 10vw, 160px);

  box-shadow:
    8px 7px 0 rgba(29,12,5,.3);

  transform:
    rotate(-1deg);

  clip-path:
    polygon(
      1% 4%,
      99% 0,
      100% 94%,
      2% 100%
    );
}


.title-line .red {

  color:
    var(--red);
}


.hero-subtitle {

  display: inline-block;

  margin:
    12px 0 0 220px;

  background:
    #dfcea8;

  color:
    #241811;

  padding:
    8px 13px;

  font-family:
    "Special Elite",
    monospace;

  font-size:
    19px;

  transform:
    rotate(-1deg);

  box-shadow:
    4px 4px 0 rgba(0,0,0,.15);
}


/* ======================================================
   GLOBO ANTIGUO
   ====================================================== */

.globe-wrap {

  position: absolute;

  left: 4px;
  top: 415px;

  width: 320px;
  height: 370px;

  z-index: 6;
}


.globe {

  position: absolute;

  left: 0;
  top: 0;

  width: 290px;
  height: 290px;

  border-radius: 50%;

  border:
    9px solid #4e2f1e;

  background:

    radial-gradient(
      ellipse at 35% 45%,
      rgba(69,103,64,.65) 0 8%,
      transparent 9%
    ),

    radial-gradient(
      ellipse at 63% 30%,
      rgba(77,106,64,.7) 0 12%,
      transparent 13%
    ),

    radial-gradient(
      ellipse at 60% 68%,
      rgba(70,98,62,.72) 0 14%,
      transparent 15%
    ),

    repeating-linear-gradient(
      0deg,
      transparent 0 28px,
      rgba(90,55,30,.32) 29px,
      transparent 30px
    ),

    repeating-linear-gradient(
      90deg,
      transparent 0 34px,
      rgba(90,55,30,.24) 35px,
      transparent 36px
    ),

    #caa36b;

  box-shadow:

    inset -35px -20px 50px
    rgba(64,30,15,.32),

    15px 20px 30px
    rgba(19,8,3,.32);

  transform:
    rotate(-8deg);
}


.globe::before {

  content: "";

  position: absolute;

  left: 50%;
  top: -20px;

  width: 130px;
  height: 325px;

  border:
    6px solid #765033;

  border-radius:
    50%;

  transform:
    translateX(-50%);

  pointer-events: none;
}


.globe-stand {

  position: absolute;

  bottom: 25px;
  left: 92px;

  width: 115px;
  height: 27px;

  background:
    #5a321e;

  border-radius:
    50%;

  box-shadow:
    0 8px 0 #352014;
}


/* ======================================================
   TELEVISOR RETRO
   ====================================================== */

.tv {

  position: absolute;

  left: 300px;
  top: 490px;

  width: 305px;
  height: 235px;

  padding:
    17px;

  background:
    #9d302b;

  border:
    7px solid #65211f;

  border-radius:
    16px;

  transform:
    rotate(-2deg);

  box-shadow:
    13px 16px 0 rgba(25,8,4,.33);

  z-index: 7;
}


.tv-screen {

  width: 100%;
  height: 100%;

  border:
    7px solid #281b17;

  border-radius:
    26px;

  overflow: hidden;

  background:

    linear-gradient(
      to top,
      rgba(190,82,41,.75),
      transparent 50%
    ),

    linear-gradient(
      #24333f,
      #75412c
    );

  position: relative;
}


.tv-screen::before {

  content: "CAMPUS";

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%,-50%);

  color:
    #e6b468;

  font-family:
    "Special Elite",
    monospace;

  letter-spacing:
    .22em;

  font-size:
    20px;

  text-shadow:
    0 2px 8px black;
}


/* ======================================================
   CASETES
   ====================================================== */

.cassettes {

  position: absolute;

  left: 465px;
  top: 720px;

  z-index: 8;

  transform:
    rotate(-2deg);
}


.cassette {

  width: 210px;

  padding:
    8px 15px;

  margin-top:
    -1px;

  border:
    2px solid #332016;

  font-family:
    "Special Elite",
    monospace;

  font-size:
    11px;

  color:
    #241711;

  box-shadow:
    4px 4px 0 rgba(0,0,0,.17);
}


.cassette:nth-child(1) {
  background: #c3ad84;
}

.cassette:nth-child(2) {
  background: #bc8b37;
}

.cassette:nth-child(3) {
  background: #975049;
}


/* ======================================================
   CD
   ====================================================== */

.cd {

  position: absolute;

  left: 315px;
  top: 760px;

  width: 200px;
  height: 200px;

  border-radius: 50%;

  z-index: 6;

  background:

    radial-gradient(
      circle,
      transparent 0 17px,
      #b8aaa3 18px 29px,
      transparent 30px
    ),

    conic-gradient(
      #d1cabd,
      #a6b5b3,
      #d69d89,
      #d9c35e,
      #91b6ae,
      #cca1be,
      #d1cabd
    );

  box-shadow:
    10px 14px 25px rgba(0,0,0,.28);

  transform:
    rotate(8deg);
}


/* ======================================================
   DISCMAN
   ====================================================== */

.discman {

  position: absolute;

  left: 25px;
  top: 750px;

  width: 235px;
  height: 155px;

  border-radius:
    55px 55px 35px 35px;

  background:
    linear-gradient(
      145deg,
      #d5c6ad,
      #92735e
    );

  border:
    5px solid #432a1d;

  z-index: 7;

  transform:
    rotate(3deg);

  box-shadow:
    9px 11px 0 rgba(0,0,0,.2);
}


.discman::after {

  content: "";

  position: absolute;

  width: 125px;
  height: 125px;

  border:
    2px solid rgba(70,45,30,.6);

  border-radius: 50%;

  left: 53px;
  top: 13px;
}


/* ======================================================
   REVISTAS
   ====================================================== */

.magazines {

  position: absolute;

  right: -30px;
  top: -40px;

  width: 155px;
  height: 210px;

  background:
    #c4a174;

  border:
    7px solid #261711;

  transform:
    rotate(11deg);

  z-index: 5;

  box-shadow:
    10px 12px 0 rgba(0,0,0,.25);
}


.magazines::before {

  content: "TV HITS";

  position: absolute;

  top: 15px;
  left: 8px;

  right: 8px;

  padding:
    8px;

  background:
    #ab302c;

  color:
    #eee1bf;

  text-align:
    center;

  font-family:
    Anton,
    sans-serif;

  font-size:
    28px;
}


/* ======================================================
   HOJA LOGIN
   ====================================================== */

.login-paper {

  position: absolute;

  right: 70px;
  top: 125px;

  width: min(530px, 46vw);

  min-height: 660px;

  padding:
    68px 57px 48px;

  z-index: 20;

  color:
    var(--ink);

  background:

    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 31px,
      rgba(81,57,40,.055) 32px
    ),

    var(--paper);

  box-shadow:

    -8px 10px 0
    rgba(235,218,182,.82),

    17px 19px 0
    rgba(31,13,5,.25),

    0 24px 50px
    rgba(0,0,0,.19);

  transform:
    rotate(.45deg);

  transition:
    background .3s ease,
    color .3s ease;
}


/* cinta adhesiva */

.login-paper::before {

  content: "";

  position: absolute;

  top: -18px;
  left: 65px;

  width: 85px;
  height: 34px;

  background:
    rgba(210,183,132,.72);

  transform:
    rotate(-4deg);

  box-shadow:
    0 2px 4px rgba(0,0,0,.15);
}


/* ======================================================
   TABS
   ====================================================== */

.tabs {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  margin-bottom:
    43px;

  box-shadow:
    0 4px 9px
    rgba(61,34,20,.12);
}


.tab {

  border: 0;

  padding:
    17px 9px;

  font-family:
    "Special Elite",
    monospace;

  font-weight:
    bold;

  font-size:
    14px;

  cursor:
    pointer;

  color:
    var(--ink);

  background:
    #e4cfa7;

  transition:
    background .2s,
    color .2s;
}


.tab.active {

  background:
    var(--red);

  color:
    #f9edda;
}


/* ======================================================
   FORMULARIOS
   ====================================================== */

.form-section {

  display:
    none;
}


.form-section.active {

  display:
    block;

  animation:
    fade .22s ease;
}


@keyframes fade {

  from {
    opacity: 0;
    transform:
      translateY(5px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }
}


label {

  display:
    block;

  margin:
    21px 0 8px;

  font-family:
    "Special Elite",
    monospace;

  font-size:
    12px;

  text-transform:
    uppercase;

  letter-spacing:
    .08em;
}


input {

  width:
    100%;

  padding:
    16px;

  border:
    1px solid
    rgba(59,39,28,.55);

  border-radius:
    5px;

  outline:
    none;

  background:
    rgba(255,249,234,.48);

  color:
    var(--ink);

  font-size:
    15px;
}


html[data-theme="dark"] input {

  background:
    rgba(24,16,13,.58);
}


input:focus {

  border-color:
    var(--red);

  box-shadow:
    0 0 0 3px
    rgba(157,41,39,.12);
}


/* ======================================================
   BOTÓN
   ====================================================== */

.primary {

  width:
    100%;

  margin-top:
    24px;

  padding:
    17px;

  border:
    none;

  border-radius:
    5px;

  background:
    var(--red);

  color:
    #fff0d8;

  font-family:
    "Special Elite",
    monospace;

  font-size:
    16px;

  letter-spacing:
    .06em;

  cursor:
    pointer;

  box-shadow:
    5px 5px 0 rgba(42,17,10,.19);

  transition:
    transform .18s,
    background .18s;
}


.primary:hover {

  background:
    var(--red-dark);

  transform:
    translate(2px,2px);
}


/* ======================================================
   DIVISOR
   ====================================================== */

.separator {

  display:
    flex;

  align-items:
    center;

  gap:
    13px;

  margin:
    32px 0 20px;

  font-family:
    "Special Elite",
    monospace;

  font-size:
    11px;
}


.separator::before,
.separator::after {

  content:
    "";

  flex:
    1;

  height:
    1px;

  background:
    rgba(70,46,30,.35);
}


/* ======================================================
   GOOGLE
   ====================================================== */

.google {

  width:
    100%;

  padding:
    15px;

  border:
    1px solid
    rgba(61,39,27,.5);

  border-radius:
    5px;

  color:
    var(--ink);

  background:
    rgba(255,249,235,.35);

  font-weight:
    700;

  font-size:
    14px;

  cursor:
    pointer;

  transition:
    transform .2s;
}


.google:hover {

  transform:
    translateY(-2px);
}


/* ======================================================
   MENSAJE INFERIOR
   ====================================================== */

.paper-note {

  margin-top:
    34px;

  padding:
    14px 18px;

  background:
    #d6bd8e;

  color:
    #39251a;

  font-family:
    "Special Elite",
    monospace;

  font-size:
    12px;

  line-height:
    1.5;

  transform:
    rotate(-1.5deg);

  box-shadow:
    3px 4px 0 rgba(0,0,0,.09);
}


/* ======================================================
   ERRORES
   ====================================================== */

.message {

  display:
    none;

  margin-top:
    18px;

  padding:
    12px 14px;

  border:
    1px solid rgba(66,42,29,.3);

  font-size:
    13px;
}


.message.ok {

  display:
    block;

  background:
    rgba(100,126,89,.17);

  border-left:
    5px solid
    #657956;
}


.message.error {

  display:
    block;

  background:
    rgba(158,42,38,.12);

  border-left:
    5px solid
    var(--red);
}


/* ======================================================
   LOADING
   ====================================================== */

.form-loading button {

  opacity:
    .6;

  pointer-events:
    none;
}


/* ======================================================
   MOBILE
   ====================================================== */

@media(max-width: 1000px) {

  .page {

    width:
      100%;

    min-height:
      auto;

    padding:
      20px;

    display:
      flex;

    flex-direction:
      column;

    align-items:
      center;
  }


  .brand,
  .mini-menu,
  .hero,
  .globe-wrap,
  .tv,
  .cassettes,
  .cd,
  .discman,
  .magazines {

    position:
      relative;

    left:
      auto;

    right:
      auto;

    top:
      auto;

  }


  .mini-menu {

    margin-top:
      20px;

    justify-content:
      center;

    flex-wrap:
      wrap;
  }


  .hero {

    width:
      100%;

    text-align:
      center;

    margin:
      65px 0 35px;
  }


  .title-line {

    font-size:
      clamp(65px,18vw,110px);
  }


  .hero-subtitle {

    margin:
      10px auto;
  }


  .globe-wrap,
  .tv,
  .cassettes,
  .cd,
  .discman,
  .magazines {

    display:
      none;
  }


  .login-paper {

    position:
      relative;

    right:
      auto;

    top:
      auto;

    width:
      min(100%,570px);

    min-height:
      auto;

    padding:
      55px 30px 38px;

    margin-bottom:
      60px;
  }


  .theme-toggle {

    position:
      fixed;

    top:
      13px;

    right:
      13px;
  }

}


</style>

</head>


<body>


<main class="page">


<!-- ======================================================
     MARCA
     ====================================================== -->

<div class="brand">

  <span>UNIVERSO</span>
  <span>DEL ESTUDIANTE</span>

</div>



<div class="mini-menu">

  <span>CURSOS</span>
  <span>APUNTES</span>
  <span>PROGRESO</span>
  <span>DIPLOMAS</span>

</div>



<button
  class="theme-toggle"
  id="themeToggle"
>

  ☾ noche

</button>



<!-- ======================================================
     TÍTULO
     ====================================================== -->

<section class="hero">

  <div class="title-line">

    TU <span class="red">CAMPUS.</span>

  </div>


  <div class="hero-subtitle">

    Todos tus cursos, apuntes, progreso<br>
    y diplomas en un solo lugar.

  </div>

</section>



<!-- ======================================================
     OBJETOS RETRO
     ====================================================== -->

<div class="globe-wrap">

  <div class="globe"></div>

  <div class="globe-stand"></div>

</div>



<div class="tv">

  <div class="tv-screen"></div>

</div>



<div class="cassettes">

  <div class="cassette">
    GOOD MUSIC
  </div>

  <div class="cassette">
    BETTER GRADES
  </div>

  <div class="cassette">
    STUDY MODE
  </div>

</div>



<div class="cd"></div>

<div class="discman"></div>

<div class="magazines"></div>



<!-- ======================================================
     LOGIN PAPER
     ====================================================== -->

<section
  class="login-paper"
  id="formCard"
>


  <div class="tabs">


    <button
      class="tab active"
      onclick="showLogin()"
    >

      INICIAR SESIÓN

    </button>


    <button
      class="tab"
      onclick="showRegister()"
    >

      CREAR CUENTA

    </button>


  </div>



  <!-- LOGIN -->

  <div
    id="loginSection"
    class="form-section active"
  >


    <label>
      Correo electrónico
    </label>


    <input
      id="loginEmail"
      type="email"
      placeholder="tuemail@gmail.com"
      autocomplete="email"
    >



    <label>
      Contraseña
    </label>


    <input
      id="loginPassword"
      type="password"
      placeholder="••••••••"
      autocomplete="current-password"
    >



    <button
      class="primary"
      onclick="login()"
    >

      ENTRAR A MI CAMPUS

    </button>



    <div class="separator">

      O ENTRÁ CON

    </div>



    <button
      class="google"
      onclick="loginGoogle()"
    >

      G&nbsp;&nbsp; Continuar con Google

    </button>


  </div>



  <!-- CREAR CUENTA -->

  <div
    id="registerSection"
    class="form-section"
  >


    <label>
      Tu nombre
    </label>


    <input
      id="registerName"
      type="text"
      placeholder="¿Cómo te llamás?"
      autocomplete="name"
    >



    <label>
      Correo electrónico
    </label>


    <input
      id="registerEmail"
      type="email"
      placeholder="tuemail@gmail.com"
      autocomplete="email"
    >



    <label>
      Contraseña
    </label>


    <input
      id="registerPassword"
      type="password"
      placeholder="Mínimo 6 caracteres"
      autocomplete="new-password"
    >



    <button
      class="primary"
      onclick="register()"
    >

      CREAR MI CUENTA

    </button>



    <div class="separator">

      O REGISTRATE CON

    </div>



    <button
      class="google"
      onclick="loginGoogle()"
    >

      G&nbsp;&nbsp; Registrarme con Google

    </button>


  </div>



  <div
    id="message"
    class="message"
  ></div>



  <div class="paper-note">

    Hacete una cuenta y empezá a construir
    tu propia historia de estudio.

  </div>


</section>


</main>



<script>


/* ======================================================
   PEGÁ AQUÍ TUS DOS DATOS DE SUPABASE
   ====================================================== */


const SUPABASE_URL =
  "https://ohlgifhdmqzqymnkjnwe.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_0o_hbYuQFkWQ49u6gCTNgg_2kd6QAiu";


const supabaseClient =
  window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY

  );



/* URL DEL LOGIN */

const LOGIN_URL =
  window.location.origin +
  window.location.pathname;



/* ======================================================
   TABS
   ====================================================== */


function showLogin() {


  document
    .querySelectorAll(".tab")
    .forEach(
      tab =>
        tab.classList.remove("active")
    );


  document
    .querySelectorAll(".tab")[0]
    .classList.add("active");


  document
    .querySelectorAll(".form-section")
    .forEach(
      section =>
        section.classList.remove("active")
    );


  document
    .getElementById("loginSection")
    .classList.add("active");


  clearMessage();

}



function showRegister() {


  document
    .querySelectorAll(".tab")
    .forEach(
      tab =>
        tab.classList.remove("active")
    );


  document
    .querySelectorAll(".tab")[1]
    .classList.add("active");


  document
    .querySelectorAll(".form-section")
    .forEach(
      section =>
        section.classList.remove("active")
    );


  document
    .getElementById("registerSection")
    .classList.add("active");


  clearMessage();

}



/* ======================================================
   REGISTRO
   ====================================================== */


async function register() {


  const name =
    document
      .getElementById("registerName")
      .value
      .trim();


  const email =
    document
      .getElementById("registerEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("registerPassword")
      .value;



  if (!name || !email || !password) {


    showMessage(

      "Completá todos los datos para crear tu cuenta.",

      "error"

    );


    return;

  }



  if (password.length < 6) {


    showMessage(

      "La contraseña necesita al menos 6 caracteres.",

      "error"

    );


    return;

  }



  setLoading(true);



  try {


    const { data, error } =
      await supabaseClient.auth.signUp({


        email: email,


        password: password,


        options: {


          data: {

            full_name: name

          },


          emailRedirectTo:
            LOGIN_URL


        }


      });



    if (error) {

      throw error;

    }



    showMessage(

      "¡Cuenta creada! Revisá tu correo y confirmá tu cuenta para entrar al campus.",

      "ok"

    );


  }


  catch (error) {


    showMessage(

      error.message ||
      "No pudimos crear la cuenta. Intentá nuevamente.",

      "error"

    );


  }


  finally {


    setLoading(false);


  }


}



/* ======================================================
   LOGIN
   ====================================================== */


async function login() {


  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("loginPassword")
      .value;



  if (!email || !password) {


    showMessage(

      "Ingresá tu correo y contraseña.",

      "error"

    );


    return;

  }



  setLoading(true);



  try {


    const { data, error } =
      await supabaseClient.auth
        .signInWithPassword({


          email: email,


          password: password


        });



    if (error) {

      throw error;

    }



    window.location.href =
      "campus.html";


  }


  catch (error) {


    showMessage(

      "No pudimos iniciar sesión. Revisá los datos y comprobá que hayas confirmado tu correo.",

      "error"

    );


  }


  finally {


    setLoading(false);


  }


}



/* ======================================================
   GOOGLE
   ====================================================== */


async function loginGoogle() {


  const { error } =
    await supabaseClient.auth
      .signInWithOAuth({


        provider:
          "google",


        options: {


          redirectTo:
            LOGIN_URL


        }


      });



  if (error) {


    showMessage(

      error.message,

      "error"

    );


  }


}



/* ======================================================
   SESIÓN EXISTENTE
   ====================================================== */


async function checkSession() {


  const { data } =
    await supabaseClient.auth
      .getSession();



  if (data.session) {


    window.location.href =
      "campus.html";


  }


}



checkSession();



/* ======================================================
   MENSAJES
   ====================================================== */


function showMessage(
  text,
  type
) {


  const box =
    document
      .getElementById("message");


  box.textContent =
    text;


  box.className =
    "message " + type;


}



function clearMessage() {


  const box =
    document
      .getElementById("message");


  box.textContent =
    "";


  box.className =
    "message";


}



/* ======================================================
   LOADING
   ====================================================== */


function setLoading(value) {


  document
    .getElementById("formCard")
    .classList
    .toggle(
      "form-loading",
      value
    );


}



/* ======================================================
   MODO OSCURO
   ====================================================== */


const themeToggle =
  document
    .getElementById(
      "themeToggle"
    );



function applyTheme(theme) {


  document
    .documentElement
    .setAttribute(
      "data-theme",
      theme
    );


  localStorage.setItem(
    "ude-theme",
    theme
  );


  themeToggle.textContent =
    theme === "dark"
      ? "☀ cálido"
      : "☾ noche";


}



const savedTheme =
  localStorage.getItem(
    "ude-theme"
  );


const systemDark =
  window
    .matchMedia(
      "(prefers-color-scheme: dark)"
    )
    .matches;



applyTheme(

  savedTheme ||

  (
    systemDark
      ? "dark"
      : "light"
  )

);



themeToggle
  .addEventListener(
    "click",
    () => {


      const current =
        document
          .documentElement
          .getAttribute(
            "data-theme"
          );


      applyTheme(

        current === "dark"
          ? "light"
          : "dark"

      );


    }
  );


</script>

</body>
</html>
